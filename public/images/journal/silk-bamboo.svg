<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">絲竹合奏的聲音分工</title><desc id="desc">竹管：氣息延續的線條；拉弦：持續與連接的質地；彈撥：清楚的音頭與節奏；合奏：在共同落點彼此相遇</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">絲竹合奏的聲音分工</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">竹管</text><text x="54" y="199" font-size="24" fill="#495642">氣息延續的線條</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">拉弦</text><text x="54" y="319" font-size="24" fill="#495642">持續與連接的質地</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">彈撥</text><text x="54" y="439" font-size="24" fill="#495642">清楚的音頭與節奏</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">合奏</text><text x="54" y="559" font-size="24" fill="#495642">在共同落點彼此相遇</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 竹笛文化</text></g></svg>