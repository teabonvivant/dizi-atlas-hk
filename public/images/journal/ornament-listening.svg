<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">裝飾音的聆聽順序</title><desc id="desc">主幹：先唱主要旋律；入口：從哪一個音靠近；重心：裝飾強調甚麼；回歸：如何接回主句</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">裝飾音的聆聽順序</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">主幹</text><text x="54" y="199" font-size="24" fill="#495642">先唱主要旋律</text><path d="M320 227 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">入口</text><text x="54" y="319" font-size="24" fill="#495642">從哪一個音靠近</text><path d="M320 347 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">重心</text><text x="54" y="439" font-size="24" fill="#495642">裝飾強調甚麼</text><path d="M320 467 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">回歸</text><text x="54" y="559" font-size="24" fill="#495642">如何接回主句</text><path d="M320 587 v12" stroke="#9d5548" stroke-width="2"/></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 聆聽筆記</text></g></svg>