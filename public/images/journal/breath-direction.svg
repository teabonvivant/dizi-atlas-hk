<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">尋找容易重複的發音</title><desc id="desc">安放：下唇與吹孔穩定；微調：一次只改一個角度；比較：聽音芯是否清楚；重現：放下再拿起測試</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">尋找容易重複的發音</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">安放</text><text x="54" y="199" font-size="24" fill="#495642">下唇與吹孔穩定</text><path d="M320 227 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">微調</text><text x="54" y="319" font-size="24" fill="#495642">一次只改一個角度</text><path d="M320 347 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">比較</text><text x="54" y="439" font-size="24" fill="#495642">聽音芯是否清楚</text><path d="M320 467 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">重現</text><text x="54" y="559" font-size="24" fill="#495642">放下再拿起測試</text><path d="M320 587 v12" stroke="#9d5548" stroke-width="2"/></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 氣息與音色</text></g></svg>