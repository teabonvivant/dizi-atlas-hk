<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">文學與演奏如何互相照亮</title><desc id="desc">原文：理解時代與語境；器物：另以實物資料核對；想像：用畫面探索樂句語氣；聆聽：讓聲音檢查表達效果</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">文學與演奏如何互相照亮</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">原文</text><text x="54" y="199" font-size="24" fill="#495642">理解時代與語境</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">器物</text><text x="54" y="319" font-size="24" fill="#495642">另以實物資料核對</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">想像</text><text x="54" y="439" font-size="24" fill="#495642">用畫面探索樂句語氣</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">聆聽</text><text x="54" y="559" font-size="24" fill="#495642">讓聲音檢查表達效果</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 竹笛文化</text></g></svg>