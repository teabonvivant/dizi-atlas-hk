<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">兩種播放方式，兩種觀察距離</title><desc id="desc">耳筒：容易留意近距離細節；音箱：房間也參與聲音；比較：保持舒適而相近的音量；回聽：最後連續聽完整樂句</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">兩種播放方式，兩種觀察距離</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">耳筒</text><text x="54" y="199" font-size="24" fill="#495642">容易留意近距離細節</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">音箱</text><text x="54" y="319" font-size="24" fill="#495642">房間也參與聲音</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">比較</text><text x="54" y="439" font-size="24" fill="#495642">保持舒適而相近的音量</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">回聽</text><text x="54" y="559" font-size="24" fill="#495642">最後連續聽完整樂句</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 聆聽筆記</text></g></svg>