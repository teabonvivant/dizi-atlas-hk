<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">拍號與重心分開理解</title><desc id="desc">二拍：兩拍形成一組；三拍：三拍形成一組；四拍：四拍內仍有層次；換拍：先找保持相同的單位</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">拍號與重心分開理解</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">二拍</text><text x="54" y="199" font-size="24" fill="#495642">兩拍形成一組</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">三拍</text><text x="54" y="319" font-size="24" fill="#495642">三拍形成一組</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">四拍</text><text x="54" y="439" font-size="24" fill="#495642">四拍內仍有層次</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">換拍</text><text x="54" y="559" font-size="24" fill="#495642">先找保持相同的單位</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 讀譜與節奏</text></g></svg>