<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">從聲音認識作品的對比</title><desc id="desc">速度：舒展與活躍；音區：低處與高處的距離；音色：明亮與含蓄的轉換；結構：不同段落如何相連</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">從聲音認識作品的對比</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">速度</text><text x="54" y="199" font-size="24" fill="#495642">舒展與活躍</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">音區</text><text x="54" y="319" font-size="24" fill="#495642">低處與高處的距離</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">音色</text><text x="54" y="439" font-size="24" fill="#495642">明亮與含蓄的轉換</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">結構</text><text x="54" y="559" font-size="24" fill="#495642">不同段落如何相連</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 曲中風景</text></g></svg>