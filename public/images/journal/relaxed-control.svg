<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">承托與活動分開安排</title><desc id="desc">支點：讓樂器保持位置；手指：輕覆孔面，方便開合；肩頸：保留自然活動空間；聲音：以穩定音芯驗證調整</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">承托與活動分開安排</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">支點</text><text x="54" y="199" font-size="24" fill="#495642">讓樂器保持位置</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">手指</text><text x="54" y="319" font-size="24" fill="#495642">輕覆孔面，方便開合</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">肩頸</text><text x="54" y="439" font-size="24" fill="#495642">保留自然活動空間</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">聲音</text><text x="54" y="559" font-size="24" fill="#495642">以穩定音芯驗證調整</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 氣息與音色</text></g></svg>