<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">竹笛的三種舞台角色</title><desc id="desc">伴唱：回應人聲與動作；合奏：在多個聲部之間配合；獨奏：承擔作品的主要敘述；協作：按不同編制重新聆聽</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">竹笛的三種舞台角色</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">伴唱</text><text x="54" y="199" font-size="24" fill="#495642">回應人聲與動作</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">合奏</text><text x="54" y="319" font-size="24" fill="#495642">在多個聲部之間配合</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">獨奏</text><text x="54" y="439" font-size="24" fill="#495642">承擔作品的主要敘述</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">協作</text><text x="54" y="559" font-size="24" fill="#495642">按不同編制重新聆聽</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 竹笛文化</text></g></svg>