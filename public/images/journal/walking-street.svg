<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">合奏裏的四個觀察方向</title><desc id="desc">質地：持續音與短促音；輪廓：共同旋律如何流動；加花：不同聲部的細節；回應：自己的聲音如何融入</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">合奏裏的四個觀察方向</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">質地</text><text x="54" y="199" font-size="24" fill="#495642">持續音與短促音</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">輪廓</text><text x="54" y="319" font-size="24" fill="#495642">共同旋律如何流動</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">加花</text><text x="54" y="439" font-size="24" fill="#495642">不同聲部的細節</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">回應</text><text x="54" y="559" font-size="24" fill="#495642">自己的聲音如何融入</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 曲中風景</text></g></svg>