<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">比較版本的四個層次</title><desc id="desc">身分：演奏者與改編資料；共同段落：先找到相同旋律；處理：速度、分句、裝飾；理由：每種選擇帶來的效果</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">比較版本的四個層次</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">身分</text><text x="54" y="199" font-size="24" fill="#495642">演奏者與改編資料</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">共同段落</text><text x="54" y="319" font-size="24" fill="#495642">先找到相同旋律</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">處理</text><text x="54" y="439" font-size="24" fill="#495642">速度、分句、裝飾</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">理由</text><text x="54" y="559" font-size="24" fill="#495642">每種選擇帶來的效果</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 聆聽筆記</text></g></svg>