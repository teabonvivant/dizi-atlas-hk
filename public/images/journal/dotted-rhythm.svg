<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">附點四分音符接八分音符</title><desc id="desc">細分：總共四個八分單位；長音：佔前三個單位；短音：佔最後一個單位；合計：兩拍，比例為三比一</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">附點四分音符接八分音符</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">細分</text><text x="54" y="199" font-size="24" fill="#495642">總共四個八分單位</text><path d="M320 227 v12" stroke="#9d5548" stroke-width="2"/><g fill="#9d5548"><circle cx="504" cy="154" r="3"/><circle cx="528" cy="154" r="3"/><circle cx="552" cy="154" r="3"/><circle cx="576" cy="154" r="3"/></g></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">長音</text><text x="54" y="319" font-size="24" fill="#495642">佔前三個單位</text><path d="M320 347 v12" stroke="#9d5548" stroke-width="2"/><g fill="#9d5548"><circle cx="504" cy="274" r="3"/><circle cx="528" cy="274" r="3"/><circle cx="552" cy="274" r="3"/><circle cx="576" cy="274" r="3"/></g></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">短音</text><text x="54" y="439" font-size="24" fill="#495642">佔最後一個單位</text><path d="M320 467 v12" stroke="#9d5548" stroke-width="2"/><g fill="#9d5548"><circle cx="504" cy="394" r="3"/><circle cx="528" cy="394" r="3"/><circle cx="552" cy="394" r="3"/><circle cx="576" cy="394" r="3"/></g></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">合計</text><text x="54" y="559" font-size="24" fill="#495642">兩拍，比例為三比一</text><path