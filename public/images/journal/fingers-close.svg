<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">手指動作的三種觀察</title><desc id="desc">距離：足夠開孔，避免抬得過高；留守：不動的手指保持密合；節奏：換指落在預定拍點；感覺：加速後仍能輕鬆返回</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">手指動作的三種觀察</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">距離</text><text x="54" y="199" font-size="24" fill="#495642">足夠開孔，避免抬得過高</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">留守</text><text x="54" y="319" font-size="24" fill="#495642">不動的手指保持密合</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">節奏</text><text x="54" y="439" font-size="24" fill="#495642">換指落在預定拍點</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">感覺</text><text x="54" y="559" font-size="24" fill="#495642">加速後仍能輕鬆返回</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 手指與吐音</text></g></svg>