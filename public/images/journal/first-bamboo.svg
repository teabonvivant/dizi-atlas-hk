<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">試笛時的四個觀察</title><desc id="desc">合手：肩膀與手腕舒適；密合：指腹能自然封孔；發音：中音可以重複吹出；整理：記下笛調與保養安排</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">試笛時的四個觀察</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">合手</text><text x="54" y="199" font-size="24" fill="#495642">肩膀與手腕舒適</text><path d="M320 227 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">密合</text><text x="54" y="319" font-size="24" fill="#495642">指腹能自然封孔</text><path d="M320 347 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">發音</text><text x="54" y="439" font-size="24" fill="#495642">中音可以重複吹出</text><path d="M320 467 v12" stroke="#9d5548" stroke-width="2"/></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">整理</text><text x="54" y="559" font-size="24" fill="#495642">記下笛調與保養安排</text><path d="M320 587 v12" stroke="#9d5548" stroke-width="2"/></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 初識竹笛</text></g></svg>