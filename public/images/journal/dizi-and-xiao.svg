<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">辨認笛簫的四個位置</title><desc id="desc">竹笛：橫持，側面吹孔；洞簫：直持，管端吹口；有膜笛：另有覆膜的膜孔；新笛：橫吹，也可沒有笛膜</desc><rect width="640" height="660" fill="#e9eee3"/><g font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif" fill="#274b36"><text x="32" y="62" font-size="30" font-weight="700">辨認笛簫的四個位置</text><path d="M32 88 H608" stroke="#9ca88f"/><g><rect x="32" y="122" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="161" font-size="26" font-weight="700">竹笛</text><text x="54" y="199" font-size="24" fill="#495642">橫持，側面吹孔</text></g><g><rect x="32" y="242" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="281" font-size="26" font-weight="700">洞簫</text><text x="54" y="319" font-size="24" fill="#495642">直持，管端吹口</text></g><g><rect x="32" y="362" width="576" height="104" rx="8" fill="#fffdf6" stroke="#b7bfae"/><text x="54" y="401" font-size="26" font-weight="700">有膜笛</text><text x="54" y="439" font-size="24" fill="#495642">另有覆膜的膜孔</text></g><g><rect x="32" y="482" width="576" height="104" rx="8" fill="#f2eee4" stroke="#b7bfae"/><text x="54" y="521" font-size="26" font-weight="700">新笛</text><text x="54" y="559" font-size="24" fill="#495642">橫吹，也可沒有笛膜</text></g><text x="32" y="637" font-size="18" fill="#53624b">中國竹笛知識庫 · 初識竹笛</text></g></svg>